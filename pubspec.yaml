name: fllama_cpp
description: >-
  Run LLMs locally in Flutter with llama.cpp: chat, tool calls, images and
  structured output on Android, iOS, macOS, Linux, Windows, and the web
  (WebGPU).
version: 0.1.0
repository: https://github.com/Telosnex/fllama_cpp
issue_tracker: https://github.com/Telosnex/fllama_cpp/issues

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  uuid: ^4.3.3
  objective_c: ^9.3.0
  # Native assets build hook dependencies
  hooks: '>=1.0.0 <3.0.0'
  code_assets: '>=1.0.0 <3.0.0'
  kiln: ^0.1.1
  native_toolchain_cmake: ^0.2.4
  logging: ^1.3.0
  crypto: ^3.0.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^9.0.0
  flutter_lints: ^2.0.0
  test: ^1.24.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Native code is built via hook/build.dart (native assets).
# No flutter: plugin: section needed — the hook replaces ffiPlugin.
