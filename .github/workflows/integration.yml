# fllama's integration tests on GitHub-hosted runners: desktop (6), desktop
# browsers (4), mobile browsers (2), the Android emulator and the iOS
# simulator. On main, nightly and by hand; pull requests run unit.yml.
name: Integration

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# bash with pipefail: a pipe into tee must not hide a failed test.
defaults:
  run:
    shell: bash

env:
  MODEL_CACHE: example/.model_cache

jobs:
  models:
    name: Models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: example
        run: |
          flutter pub get
          MODEL_CACHE_DIR="$GITHUB_WORKSPACE/$MODEL_CACHE" dart integration_test/test/download_test_models.dart
      - run: ls -la "$MODEL_CACHE"

  # Desktop: the jobs share the steps of the first (YAML anchor). CPU only
  # (FLLAMA_TEST_NUM_GPU_LAYERS=0), except the Metal job on the paravirtual
  # GPU of macos-15: fllama must skip what the GPU cannot run, and not crash.
  desktop-linux-x64:
    needs: models
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: linux-x64
      DEVICE: linux
      GPU: 'false'
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # The GPU pack files of the integration tests (several hundred MB).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache/gpu_packs
          key: fllama-gpu-packs-${{ env.TARGET }}-${{ hashFiles('native_artifacts/prebuilt.json') }}
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb > /dev/null
      - name: Integration tests
        uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: example
          # The first build of the app prints nothing for minutes.
          idle-minutes: '15'
          run: |
            flutter pub get
            export MODEL_CACHE_DIR="$GITHUB_WORKSPACE/$MODEL_CACHE"
            if [[ "$GPU" != true ]]; then export FLLAMA_TEST_NUM_GPU_LAYERS=0; fi
            run=(flutter test -d "$DEVICE" integration_test/local_llm_integration_test.dart -r expanded)
            if [[ "$RUNNER_OS" == Linux ]]; then run=(xvfb-run -a "${run[@]}"); fi
            "${run[@]}"
      - name: Crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          cp ~/Library/Logs/DiagnosticReports/*.ips "$RUNNER_TEMP/crashes/" 2> /dev/null || true
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashes-${{ env.TARGET }}
          path: ${{ runner.temp }}/crashes/
          if-no-files-found: ignore

  desktop-linux-arm64:
    needs: models
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TARGET: linux-arm64
      DEVICE: linux
      GPU: 'false'
    steps: *desktop_steps

  desktop-macos-arm64:
    needs: models
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TARGET: macos-arm64
      DEVICE: macos
      GPU: 'false'
    steps: *desktop_steps

  desktop-macos-arm64-metal:
    needs: models
    name: macOS ARM64 Metal
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TARGET: macos-arm64-metal
      DEVICE: macos
      GPU: 'true'
    steps: *desktop_steps

  desktop-windows-x64:
    needs: models
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      TARGET: windows-x64
      DEVICE: windows
      GPU: 'false'
    steps: *desktop_steps

  desktop-windows-arm64:
    needs: models
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      TARGET: windows-arm64
      DEVICE: windows
      GPU: 'false'
    steps: *desktop_steps

  # The wllama files of this commit: web_build/wllama.patch can be newer
  # than the release. Built in the emsdk image of web_build/wllama.json, as
  # kiln_release builds them; cached by the build inputs.
  web-files:
    name: Web files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: emscripten/emsdk@sha256:460fff8f8ac87e11b16447fbd66538a686eafa0e4fb977aa0989ed19fe2079f7
    steps:
      - name: Tools for checkout and Flutter
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git unzip xz-utils > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kiln_web
          key: fllama-web-files-${{ hashFiles('web_build/**', 'patches/llama.cpp/**', 'tool/kiln/build_web.dart') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - name: Build (tool/kiln/build_web.dart)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          dart tool/kiln/build_web.dart --out "$RUNNER_TEMP/kiln_web" --work "$RUNNER_TEMP/kiln_web_work"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-files
          path: ${{ runner.temp }}/kiln_web
          if-no-files-found: error

  # Desktop browsers: the jobs share the steps of the first. Flutter runs
  # dart2wasm builds only in Chromium: Firefox and Safari users get dart2js.
  web-linux-chrome-dart2js:
    needs: [models, web-files]
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BROWSER: chrome
      COMPILER: dart2js
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - name: Test files into the web directory (same origin)
        run: |
          mkdir -p example/web/test_models
          cp "$MODEL_CACHE/Qwen3.5-0.8B-Q4_K_M.gguf" "$MODEL_CACHE/Qwen3.5-0.8B-mmproj-F16.gguf" \
            test/assets/test_red.png test/assets/test_apple.png test/assets/test_orange.png \
            test/assets/test_title.png example/web/test_models/
          cp test/assets/test_red.png example/web/test_models/not_a_model.gguf
      # The web files of this commit (job web-files), with web_build: local.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-files
          path: ${{ runner.temp }}/kiln_web
      - name: Web files (web_build local)
        run: |
          flutter pub get --no-example
          # kiln reads web_build from <kiln cache>/defaults.json, as native_build.
          case "$RUNNER_OS" in
            macOS) root="$HOME/Library/Caches/kiln" ;;
            *) root="$HOME/.cache/kiln" ;;
          esac
          mkdir -p "$root"
          jq -n --arg dir "$RUNNER_TEMP/kiln_web" \
            '{schema: 1, user_defines: {web_build: "local", web_build_dir: $dir}}' > "$root/defaults.json"
          cat "$root/defaults.json"
      - name: flutter drive
        uses: Telosnex/telosnex_ci_tools/actions/web-driver@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        timeout-minutes: 25
        with:
          browser: ${{ env.BROWSER }}
          working-directory: example
          artifact-name: web-${{ env.BROWSER }}-${{ env.COMPILER }}
          # Never pass without results: the last test must have run.
          require-result: '.web.load_error_file.done == true'
          run: |
            flutter pub get
            args=(--dart-define=FLLAMA_TEST_EXPECT_COMPILER=$COMPILER)
            if [[ "$COMPILER" == dart2wasm ]]; then args+=(--wasm); fi
            flutter drive --release -d web-server --browser-name "$BROWSER" \
              --driver test_driver/integration_test.dart \
              --target integration_test/web_llm_integration_test.dart "${args[@]}"

  web-linux-chrome-dart2wasm:
    needs: [models, web-files]
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BROWSER: chrome
      COMPILER: dart2wasm
    steps: *web_steps

  web-linux-firefox-dart2js:
    needs: [models, web-files]
    name: Web Linux x64 Firefox dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BROWSER: firefox
      COMPILER: dart2js
    steps: *web_steps

  web-macos-safari-dart2js:
    needs: [models, web-files]
    name: Web macOS ARM64 Safari dart2js
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BROWSER: safari
      COMPILER: dart2js
    steps: *web_steps

  android:
    needs: models
    # ubuntu-24.04-arm has no /dev/kvm.
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      # Built before the emulator boots: Gradle and the emulator share the 4
      # CPUs (the build took 12 min beside the API 37.0 emulator, 6 min on
      # API 35). The build in the test step is then incremental.
      - name: Build the test app
        working-directory: example
        timeout-minutes: 30
        run: |
          flutter pub get
          flutter build apk --debug -t integration_test/local_llm_integration_test.dart \
            --dart-define=FLLAMA_TEST_MODEL_BASE_URL=http://10.0.2.2:8765 \
            --dart-define=FLLAMA_TEST_NUM_GPU_LAYERS=0
      - id: emulator
        uses: Telosnex/telosnex_ci_tools/actions/android-emulator@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          # The newest Android. Its google_apis image restarts Android every
          # ~40 s on CI (surfaceflinger aborts, also 36.1); the ATD image (no
          # browser, no launcher) is stable, and the app needs neither.
          api-level: '37.0'
          target: google_atd
          # 4096 MB: Android 37's low-memory killer ended the app (2.8 GB
          # resident) in "context size 0" (a 2 GB KV cache).
          ram-mb: '6144'
      - name: Integration tests
        uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: example
          idle-minutes: '15'
          run: |
            dart ../scripts/serve_test_models.dart "$GITHUB_WORKSPACE/$MODEL_CACHE" 127.0.0.1 8765 > "$RUNNER_TEMP/models.log" 2>&1 &
            flutter pub get
            # 10.0.2.2 is the host of the emulator.
            flutter test integration_test/local_llm_integration_test.dart -d "${{ steps.emulator.outputs.serial }}" -r expanded \
              --dart-define=FLLAMA_TEST_MODEL_BASE_URL=http://10.0.2.2:8765 \
              --dart-define=FLLAMA_TEST_NUM_GPU_LAYERS=0
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore

  # Mobile browsers. dart2js only: Flutter runs dart2wasm builds in Chromium
  # only, and these are compat builds (no JSPI).
  web-ios-safari-dart2js:
    needs: [models, web-files]
    name: Web iOS ARM64 Safari dart2js
    # macos-26 (Xcode 26.6, iOS 26.5 simulators). On macos-15 (iOS 26.2) the
    # first request stalled after attach_threadpool in 3 of 3 runs, and
    # Safari's first launch did not return in 5 min; GitHub calls Xcode 26
    # simulators fragile in its macOS VMs (actions/runner-images 13264).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - name: Test files into the web directory (same origin)
        run: |
          mkdir -p example/web/test_models
          cp "$MODEL_CACHE/Qwen3.5-0.8B-Q4_K_M.gguf" "$MODEL_CACHE/Qwen3.5-0.8B-mmproj-F16.gguf" \
            test/assets/test_red.png test/assets/test_apple.png test/assets/test_orange.png \
            test/assets/test_title.png example/web/test_models/
          cp test/assets/test_red.png example/web/test_models/not_a_model.gguf
      # The web files of this commit (job web-files), with web_build: local.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-files
          path: ${{ runner.temp }}/kiln_web
      - name: Web files (web_build local)
        run: |
          flutter pub get --no-example
          # kiln reads web_build from <kiln cache>/defaults.json, as native_build.
          case "$RUNNER_OS" in
            macOS) root="$HOME/Library/Caches/kiln" ;;
            *) root="$HOME/.cache/kiln" ;;
          esac
          mkdir -p "$root"
          jq -n --arg dir "$RUNNER_TEMP/kiln_web" \
            '{schema: 1, user_defines: {web_build: "local", web_build_dir: $dir}}' > "$root/defaults.json"
          cat "$root/defaults.json"
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        timeout-minutes: 15
      # web-driver opens Safari once before safaridriver (slow first launch).
      - name: flutter drive
        uses: Telosnex/telosnex_ci_tools/actions/web-driver@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        timeout-minutes: 35
        env:
          BROWSER_NAME: ios-safari
          DRIVE_FLAGS: ''
        with:
          browser: ios-safari
          working-directory: example
          artifact-name: web-ios-safari-dart2js
          # Never pass without results: the last test must have run.
          require-result: '.web.load_error_file.done == true'
          run: |
            flutter pub get
            flutter drive --release -d web-server --browser-name "$BROWSER_NAME" $DRIVE_FLAGS \
              --driver test_driver/integration_test.dart \
              --target integration_test/web_llm_integration_test.dart \
              --dart-define=FLLAMA_TEST_EXPECT_COMPILER=dart2js

  web-android-chrome-dart2js:
    needs: [models, web-files]
    name: Web Android x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - name: Test files into the web directory (same origin)
        run: |
          mkdir -p example/web/test_models
          cp "$MODEL_CACHE/Qwen3.5-0.8B-Q4_K_M.gguf" "$MODEL_CACHE/Qwen3.5-0.8B-mmproj-F16.gguf" \
            test/assets/test_red.png test/assets/test_apple.png test/assets/test_orange.png \
            test/assets/test_title.png example/web/test_models/
          cp test/assets/test_red.png example/web/test_models/not_a_model.gguf
      # The web files of this commit (job web-files), with web_build: local.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-files
          path: ${{ runner.temp }}/kiln_web
      - name: Web files (web_build local)
        run: |
          flutter pub get --no-example
          # kiln reads web_build from <kiln cache>/defaults.json, as native_build.
          case "$RUNNER_OS" in
            macOS) root="$HOME/Library/Caches/kiln" ;;
            *) root="$HOME/.cache/kiln" ;;
          esac
          mkdir -p "$root"
          jq -n --arg dir "$RUNNER_TEMP/kiln_web" \
            '{schema: 1, user_defines: {web_build: "local", web_build_dir: $dir}}' > "$root/defaults.json"
          cat "$root/defaults.json"
      - id: emulator
        uses: Telosnex/telosnex_ci_tools/actions/android-emulator@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          # The newest image with Chrome that is stable on CI: 36 (Chrome 133).
          # 36.1 and 37.0 google_apis restart Android every ~40 s
          # (surfaceflinger aborts); their ATD images have no browser.
          api-level: '36'
      # The page stays on localhost (same origin, cross-origin isolated):
      # the emulator's localhost:8091 is the runner's.
      - run: adb reverse tcp:8091 tcp:8091
      - name: flutter drive
        uses: Telosnex/telosnex_ci_tools/actions/web-driver@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        timeout-minutes: 30
        env:
          BROWSER_NAME: android-chrome
          DRIVE_FLAGS: --web-port 8091 --no-android-emulator
        with:
          browser: android-chrome
          working-directory: example
          artifact-name: web-android-chrome-dart2js
          # Never pass without results: the last test must have run.
          require-result: '.web.load_error_file.done == true'
          run: |
            flutter pub get
            flutter drive --release -d web-server --browser-name "$BROWSER_NAME" $DRIVE_FLAGS \
              --driver test_driver/integration_test.dart \
              --target integration_test/web_llm_integration_test.dart \
              --dart-define=FLLAMA_TEST_EXPECT_COMPILER=dart2js
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-android-chrome-dart2js-emulator
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore

  ios:
    needs: models
    name: iOS ARM64 simulator
    # macos-26 (Xcode 26.6, iOS 26.5 simulators): on macos-15, flutter test
    # missed the VM service in 3 of 5 runs, and its simulators stalled the
    # iOS Safari job (actions/runner-images 13264).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/.model_cache
          key: fllama-test-models-${{ hashFiles('example/integration_test/test/test_model_manager.dart') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: simulator
      - name: Serve the test models
        run: dart scripts/serve_test_models.dart "$GITHUB_WORKSPACE/$MODEL_CACHE" 127.0.0.1 8765 > "$RUNNER_TEMP/models.log" 2>&1 &
      # No build ahead (flutter build ios --simulator): its generic
      # destination does not match flutter test's -destination id=<udid>, and
      # Xcode rebuilds everything (fonnx, 2026-10-27). The first attempt runs
      # on the booted simulator; retries on fresh ones, while no test started.
      - name: Integration tests
        uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: example
          target: integration_test/local_llm_integration_test.dart
          udid: ${{ steps.simulator.outputs.udid }}
          artifact-name: ios-simulator-logs
          # The Xcode build is silent for minutes.
          idle-minutes: '15'
          args: --dart-define=FLLAMA_TEST_MODEL_BASE_URL=http://127.0.0.1:8765 --dart-define=FLLAMA_TEST_NUM_GPU_LAYERS=0
