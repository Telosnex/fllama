name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@6042c18cd940a801f4158918c126bde5520cecc3 # v0.5.2
